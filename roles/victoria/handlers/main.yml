---
- name: restart victoria-metrics
  ansible.builtin.systemd_service:
    name: victoria-metrics
    state: restarted
    daemon_reload: true
  become: true
  become_user: root

- name: restart victoria-logs
  ansible.builtin.systemd_service:
    name: victoria-logs
    state: restarted
    daemon_reload: true
  become: true
  become_user: root

- name: restart victoria-traces
  ansible.builtin.systemd_service:
    name: victoria-traces
    state: restarted
    daemon_reload: true
  become: true
  become_user: root
