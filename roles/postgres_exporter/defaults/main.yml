---
# version to install
postgres_exporter_version: 0.20.1

# target operating system
postgres_exporter_os: linux

# target architecture
postgres_exporter_arch: amd64

# maps to DATA_SOURCE_URI, like "/postgres?host=/var/run/postgresql"
postgres_exporter_database_uri: ~

# maps to DATA_SOURCE_USER
postgres_exporter_database_username: ~

# maps to DATA_SOURCE_PASS_FILE after being written to /etc/postgres_exporter_password
postgres_exporter_database_password: ~
